<title>Dark Knight Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one dark phone column - masthead, status line, four meters, controls, then the week's boards and one card per league.
   Dom's own look since Oct 8: navy night, gold frame labels, a color per league. Single dark theme on purpose. */
:root{
  --night:#0B1222; --card:#0E1628; --raise:#16213A; --rim:#24304C; --line:#2A3A5E; --hair:#1F2E50;
  --ink:#EEF1F6; --ink2:#C9CFDB; --mute:#8A93A6;
  --gold:#EFD23E; --brass:#B89A5A; --amber:#F7B32B;
  --up:#4FD08A; --dn:#FF6B72; --red:#FF4D57; --grey:#9AA2B5; --cream:#CFC8B6; --navy:#14213D;
  --l1:#5B9BF5; --l2:#F0763A; --l3:#A98BFF; --l4:#4FD6CA;
  --f-disp:"Bebas Neue","Arial Narrow",Impact,sans-serif;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;max-width:760px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-family:var(--f-num)}
.disp{font-family:var(--f-disp);font-weight:400;letter-spacing:.04em}
.mute{color:var(--mute)}

/* masthead */
header.mh{display:flex;align-items:center;gap:10px;margin:12px 0 8px;padding:12px 14px 10px;border-radius:8px;
  background:linear-gradient(180deg,var(--raise),var(--card));border-bottom:3px solid var(--gold)}
.mh img{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.mh h1{font-family:var(--f-disp);font-weight:400;font-size:29px;line-height:1;letter-spacing:.03em;margin:0;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.mh .wk{font-family:var(--f-disp);font-size:21px;color:var(--gold);white-space:nowrap;flex:none;letter-spacing:.04em}

/* framed strips with a notched label */
.frame{position:relative;background:#0A1020;border:1px solid var(--line);border-radius:10px;padding:16px 8px 8px;margin:14px 0 10px}
.frame > .lab{position:absolute;top:-8px;left:12px;padding:0 6px;background:var(--night);font:700 10.5px/16px var(--f-body);letter-spacing:.16em;color:var(--brass);text-transform:uppercase}

/* status line */
.stat{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;border-radius:8px;background:var(--raise);font-size:13px;cursor:pointer;border:0;width:100%;text-align:left}
.stat b{color:#fff;font-weight:600}
.stat .late{color:var(--dn);font-weight:700}
.sfail{margin-top:8px;padding:9px 11px;border-radius:8px;background:rgba(255,77,87,.14);border:1px solid var(--red);font-size:13px;line-height:1.45;color:#FFD6D8}
.sfail b{display:block;color:var(--red);font:700 10.5px/1.2 var(--f-body);letter-spacing:.14em;margin-bottom:4px}
.lights{display:inline-flex;gap:8px;margin-left:auto;align-items:center}
.lt{display:inline-flex;align-items:center;gap:4px;font:700 9.5px/1 var(--f-body);letter-spacing:.08em;color:var(--ink2)}
.lt i{width:10px;height:10px;border-radius:50%;display:block}
.lt.green i{background:#3DDC84;box-shadow:0 0 6px #3DDC84} .lt.yellow i{background:#F7C531;box-shadow:0 0 6px #F7C531}
.lt.red i{background:#FF4B4B;box-shadow:0 0 6px #FF4B4B} .lt.grey i{background:#5A6478}
.det{font-size:12px;color:var(--amber);text-decoration:underline}
.hc{margin:6px 0 0;padding:10px 12px;border-radius:8px;background:#0A1020;border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.hc .hh{font-weight:600;color:#fff;margin-bottom:6px}
.hc .hg{margin:8px 0 2px;font:700 10.5px/1 var(--f-body);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.hc .hr{display:flex;gap:8px;align-items:flex-start;padding:3px 0;line-height:1.35}
.hc .hr i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:4px}
.hc .hr.green i{background:#3DDC84} .hc .hr.yellow i{background:#F7C531} .hc .hr.red i{background:#FF4B4B} .hc .hr.grey i{background:#5A6478}
.hc .hr b{color:#fff;font-weight:600} .hc .hr em{font-style:normal;color:var(--mute)}
.hc .row2{min-width:0;overflow-wrap:anywhere}
.linkbtn{background:none;border:0;color:var(--amber);padding:4px 0;cursor:pointer;font-size:13px}

/* meters */
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.mtr{min-width:0;overflow:hidden;text-align:center;text-decoration:none;color:var(--ink);border-radius:6px;padding:6px 3px 7px;cursor:pointer;
  background:linear-gradient(180deg,#1A2744,#16213A 55%,#131D33);border:1px solid var(--rim);border-top:5px solid var(--lc)}
.mtr .lgn{font:700 9px/1.15 var(--f-body);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:11px}
.mtr .dk{font-family:var(--f-disp);font-size:28px;line-height:1;color:var(--lc)}
.mtr svg{display:block;width:100%;max-width:120px;margin:2px auto 0}
.mtr .pct{font-family:var(--f-disp);font-size:32px;line-height:.95}
.mtr .src{font:700 8.5px/1.2 var(--f-body);letter-spacing:.08em;color:var(--ink2)}
.xps{display:flex;flex-direction:column;margin-top:5px;gap:1px;padding:0 4px}
.xps div{display:flex;justify-content:space-between;align-items:baseline;line-height:1.1}
.xps b{font-family:var(--f-disp);font-weight:400;font-size:15px}
.xps span{font:700 7.5px/1.3 var(--f-body);letter-spacing:.02em;color:var(--mute)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:3px;margin-top:6px;padding:0 2px}
.tube{flex:1;min-width:0;text-align:left}
.tube .tb{height:6px;border-radius:3px;background:#26365A;overflow:hidden}
.tube .tb i{display:block;height:6px;border-radius:3px;background:var(--lc)}
.tube span{display:block;font:700 7.5px/1.25 var(--f-body);color:var(--ink2);letter-spacing:.02em;margin-top:2px;white-space:nowrap}
.bell{display:inline-flex;align-items:center;gap:2px;font:700 12px/1 var(--f-body);flex:none}
.bell svg{width:13px;height:13px;margin:0}
.bell.red{color:var(--red)} .bell.gold{color:var(--amber)} .bell.grey{color:var(--grey)} .bell.none{color:#4A556F}
.mstate{font:700 8px/1.2 var(--f-body);letter-spacing:.06em;color:var(--mute);margin-top:3px;text-transform:uppercase}

/* sticky scoreboard */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -4px;padding:6px 4px;background:rgba(11,18,34,.96);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.sticky[hidden]{display:none!important}
.sch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.sc{min-width:0;border:0;background:var(--raise);border-top:3px solid var(--lc);border-radius:5px;padding:4px 3px;text-align:center;cursor:pointer;line-height:1.15}
.sc .t{font-family:var(--f-disp);font-size:15px;color:var(--lc)}
.sc .s{font-family:var(--f-num);font-size:11.5px;font-weight:600;white-space:nowrap}
.sc .p{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.sc .p b{color:#fff}
.up{color:var(--up)} .dn{color:var(--dn)}
.sbar{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mute);margin-top:4px;flex-wrap:wrap}
.sbar button{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:11px;cursor:pointer;color:var(--ink2)}

/* controls */
.ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ctl a,.ctl button{display:block;text-align:center;text-decoration:none;color:#1A1206;border:1px solid #7A5A1C;border-radius:7px;padding:10px 2px;cursor:pointer;
  font-family:var(--f-disp);font-size:20px;letter-spacing:.05em;line-height:1;white-space:nowrap;overflow:hidden;
  background:linear-gradient(100deg,transparent 30%,rgba(255,246,215,.28) 46%,transparent 62%),repeating-linear-gradient(0deg,rgba(255,244,210,.22) 0 1px,transparent 1px 2px),repeating-linear-gradient(0deg,rgba(70,44,6,.2) 0 1px,transparent 1px 3px),linear-gradient(180deg,#E3BE6A,#C99A3E 50%,#A97A26);
  box-shadow:inset 0 1px 0 rgba(255,240,200,.55),inset 0 -2px 0 rgba(90,60,10,.35),0 2px 3px rgba(0,0,0,.45)}
.ctl button:disabled{opacity:.7;cursor:default}
.ctl2{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.ctl2 button{flex:1 1 30%;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:7px 4px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.ctl2 button.on{border-color:var(--up);color:var(--up)}
.rmsg{margin:6px 0 0;padding:7px 10px;border-radius:7px;background:#F2E6C4;color:var(--navy);font-weight:600;font-size:13px}

/* boards, folds */
details.fold{margin:10px 0 0;border-radius:8px;background:var(--card);border:1px solid var(--rim)}
details.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px;font-family:var(--f-disp);font-size:20px;letter-spacing:.05em;color:#fff}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"▾";margin-left:auto;color:var(--mute);font-family:var(--f-body);font-size:13px}
details.fold[open] > summary::after{content:"▴"}
details.fold > summary .cnt{font:600 11.5px/1 var(--f-body);color:var(--mute);letter-spacing:0}
details.fold > summary .cnt.hot{color:var(--dn)}
.fb{padding:0 12px 12px;min-width:0}
.card details.fold{background:rgba(255,255,255,.03);border-color:var(--hair)}
.card details.fold > summary{font-size:17px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font:700 9.5px/1.2 var(--f-body);letter-spacing:.08em;color:var(--mute);text-transform:uppercase;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:4px;border-top:1px solid var(--hair);text-align:right;vertical-align:top}
.tbl tr.me td{color:#fff;font-weight:600;background:rgba(239,210,62,.07)}
.scroll{overflow-x:auto}
.note{font-size:11.5px;color:var(--mute);line-height:1.4;margin:6px 0 0}
.chip{display:inline-block;font:700 9.5px/1 var(--f-body);letter-spacing:.06em;padding:3px 5px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.chip.r{color:var(--dn)} .chip.g{color:var(--up)} .chip.y{color:var(--amber)} .chip.n{color:var(--grey)}
.lgtag{font-family:var(--f-disp);font-size:15px;letter-spacing:.04em}

/* the Climb */
.climb .row{display:grid;grid-template-columns:42px minmax(0,1fr) 92px;gap:8px;align-items:center;margin:7px 0}
.climb .bar{position:relative;height:16px;background:#1A2540;border-radius:3px;overflow:hidden}
.climb .bar i{position:absolute;top:0;height:16px}
.climb .bar .opp{position:absolute;top:-2px;width:2px;height:20px;background:#fff}
.climb .v{font-family:var(--f-num);font-size:11.5px;text-align:right;line-height:1.2}

/* league cards */
.card{margin:16px 0 0;border-radius:8px;background:linear-gradient(180deg,var(--raise),var(--card) 55%);border-top:5px solid var(--lc);padding:10px 12px 12px;scroll-margin-top:96px}
.chd{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;row-gap:2px}
.chd .lgname{font-family:var(--f-disp);font-size:27px;line-height:1;color:#fff;padding-right:10px;border-right:2px solid #3A4A6E}
.chd .dkt{font-family:var(--f-disp);font-size:27px;line-height:1;color:var(--lc)}
.chd .vs{font-size:12px;color:var(--mute)}
.chd .opp{font-family:var(--f-disp);font-size:22px;line-height:1;color:#fff;overflow-wrap:anywhere;min-width:0}
.recl{font-size:11.5px;color:var(--ink2);margin-top:3px}
.score{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:10px}
.score .side{min-width:0}
.score .side span{display:block;font:700 9.5px/1.2 var(--f-body);letter-spacing:.1em;color:var(--mute);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .big{font-family:var(--f-disp);font-size:46px;line-height:.95}
.score .side.r{text-align:right}
.score .mid{text-align:center;flex:none}
.score .mid .vd{font-family:var(--f-disp);font-size:20px;line-height:1;letter-spacing:.05em}
.score .mid small{display:block;font-size:10.5px;color:var(--mute)}
.proj{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-top:2px}
.played{display:flex;gap:2px;margin-top:8px;align-items:center}
.played i{flex:1;height:6px;border-radius:1px;background:#26365A}
.played i.on{background:var(--up);box-shadow:0 0 5px rgba(79,208,138,.7)} .played i.done{background:#6B7690}
.played em{font-style:normal;font:600 10px/1 var(--f-body);color:var(--ink2);margin:0 6px;white-space:nowrap}
.takes{margin-top:8px;padding:7px 9px;border-radius:6px;background:rgba(255,255,255,.04);font-size:12.5px;color:var(--ink2);line-height:1.45}
.takes b{color:#fff}
.xrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:8px}
.xrow div{background:rgba(255,255,255,.04);border-radius:6px;padding:5px 2px;text-align:center;min-width:0}
.xrow b{display:block;font-family:var(--f-disp);font-size:24px;line-height:1}
.xrow span{font:700 8.5px/1.2 var(--f-body);letter-spacing:.06em;color:var(--mute)}
.xrow em{font-style:normal;font-size:10px;font-weight:600}
.warn{margin-top:8px;padding:7px 9px;border-radius:6px;border:1px solid var(--amber);color:var(--amber);font-size:12px;line-height:1.4}
.seat{margin-top:8px;padding:8px 10px;border-radius:6px;background:rgba(255,77,87,.10);border:1px solid var(--red);font-size:12.5px;line-height:1.45}
.seat b{color:#fff} .seat .h{font:700 10px/1 var(--f-body);letter-spacing:.14em;color:var(--red);margin-bottom:4px}
.chartbox{margin-top:10px;padding:8px 8px 6px;border-radius:8px;border:1px solid var(--hair);background:rgba(10,16,32,.5)}
.chartbox .ct{font:700 10px/1.2 var(--f-body);letter-spacing:.12em;color:var(--brass);text-transform:uppercase;margin-bottom:4px}
.chartbox svg{display:block;width:100%;height:auto}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--ink2);margin-top:3px}
.key i{display:inline-block;width:14px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.key i.dot{border-top-style:dotted}
.mv{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--hair);font-size:12.5px;line-height:1.4}
.mv:first-child{border-top:0}
.mv .k{flex:none;min-width:56px}
.mv .t{flex:1;min-width:0}
.mv .x{flex:none;background:none;border:1px solid var(--line);border-radius:4px;color:var(--mute);cursor:pointer;padding:0 6px;font-size:12px}
.pk{padding:7px 0;border-top:1px solid var(--hair);font-size:12.5px;line-height:1.45}
.pk:first-child{border-top:0}
.pk b{color:#fff}
.sub{font:700 10.5px/1.2 var(--f-body);letter-spacing:.12em;color:var(--brass);text-transform:uppercase;margin:12px 0 4px}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.funnel div{text-align:center;background:rgba(255,255,255,.04);border-radius:6px;padding:5px 2px}
.funnel b{display:block;font-family:var(--f-disp);font-size:22px;line-height:1}
.funnel span{font:700 8.5px/1.2 var(--f-body);letter-spacing:.06em;color:var(--mute)}
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat div{border-radius:4px;padding:5px 0;text-align:center;font-size:11px;font-weight:600;color:#0B1222}
.heat span{display:block;font-size:9px;font-weight:700;opacity:.8}
.xpc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.xpc .c{background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:6px;padding:6px 8px;min-width:0}
.xpc .c b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpc .c .why{font-size:10.5px;color:var(--mute)}
.xpc .c .ns{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:11px;margin-top:3px}
.xpc .c.split{border-color:var(--amber)}
.wxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.wc{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:5px;border:1px solid var(--hair);background:rgba(255,255,255,.03);font-size:12px;line-height:1.3;min-width:0}
.wc.bad{border-color:var(--dn);background:#2A1A26}
.wc svg{flex:none;width:26px;height:20px}
.wc .t{min-width:0} .wc .why{color:var(--dn);font-weight:700}
.clr{display:flex;flex-wrap:wrap;gap:6px}
.clr button{flex:1 1 30%;min-width:0;background:rgba(255,77,87,.08);border:1px solid var(--red);color:#FF8A91;border-radius:6px;padding:8px 4px;font:700 11.5px/1 var(--f-body);letter-spacing:.04em;cursor:pointer}
.clr button.arm{background:var(--red);color:#fff;box-shadow:0 0 12px rgba(255,77,87,.6)}

/* alerts */
.astrip{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.astrip .ttl{font-family:var(--f-disp);font-size:24px;line-height:1;color:#fff}
.astrip .tal{font-size:12.5px;color:var(--ink2);flex:1;min-width:0}
.abtn{background:rgba(255,77,87,.10);border:1px solid var(--red);color:#FF8A91;border-radius:6px;padding:7px 9px;font:700 11px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.abtn.sep{background:rgba(154,162,181,.10);border-color:var(--grey);color:var(--ink2)}
.abtn.arm{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 12px rgba(255,77,87,.6)}
.abtn.sep.arm{background:var(--grey);color:var(--navy)}
.ahd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.ahd .tal{flex:1;min-width:0;font-size:12px;color:var(--ink2)}
.alist{display:flex;flex-direction:column;gap:8px}
.al{--ac:var(--grey);border-radius:8px;padding:7px 10px;background:linear-gradient(180deg,var(--raise),var(--card) 75%);border:1px solid var(--rim);cursor:pointer;min-width:0}
.al.red{--ac:var(--red)} .al.gold{--ac:var(--amber)} .al.grey{--ac:var(--grey)} .al.green{--ac:#33D17A}
.al .row{display:flex;gap:9px;align-items:flex-start}
.al .tag{flex:0 0 62px;height:36px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:6px;border:2px solid var(--ac);color:var(--ac);
  font-family:var(--f-disp);font-size:15px;line-height:.95;letter-spacing:.03em;box-shadow:0 0 12px 1px color-mix(in srgb,var(--ac) 55%,transparent)}
.al .main{flex:1;min-width:0}
.al .t{font-weight:600;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.al .w{font-size:11px;color:var(--mute);margin-top:2px}
.al .age{font-family:var(--f-disp);font-size:13px;letter-spacing:.06em;color:var(--ac);margin-right:6px}

.al.read{background:var(--cream);border-color:var(--cream);color:var(--navy)}
.al.read .tag{background:var(--ac);color:var(--navy);box-shadow:none;border-color:var(--ac)}
.al.read.red .tag,.al.read.grey .tag,.al.read.green .tag{color:#fff}
.al.read .w{color:#3C4763}
.al .b{display:none;margin-top:8px;padding-top:8px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);font-size:13px;line-height:1.5;cursor:auto}
.al.open .b{display:block}
.al .b p{margin:3px 0} .al .b ul{margin:4px 0;padding-left:18px} .al .b li{margin:2px 0;font-size:12px}
.al .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.al .acts button{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:5px;cursor:pointer;border:1px solid currentColor;background:transparent}
.al .acts button.del{background:#D7262F;border-color:#D7262F;color:#fff}
.amore{width:100%;text-align:left;background:var(--raise);border:1px solid var(--rim);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--ink2)}
.empty{padding:10px 12px;border-radius:6px;background:var(--raise);font-size:13px;color:var(--ink2)}
footer{margin-top:18px;font-size:11.5px;color:var(--mute);line-height:1.5}
.top{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;flex-direction:column;gap:6px}
.top button{width:40px;height:30px;opacity:.88;border-radius:8px;border:1px solid var(--line);background:rgba(22,33,58,.95);color:var(--ink);font:700 11px/1 var(--f-body);cursor:pointer}
@media (prefers-reduced-motion:no-preference){.tube .tb i,.climb .bar i{transition:width .4s ease}}
/* Nov 5 additions: needs-you panel, alert preview, finder, deadline chips, meter extras */
.need{display:flex;flex-direction:column;gap:6px}
.nd{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:7px;border:1px solid var(--rim);border-left:4px solid var(--nc,var(--amber));background:var(--raise);cursor:pointer;min-height:44px}
.nd.red{--nc:var(--red)} .nd.gold{--nc:var(--amber)}
.nd .lgtag{flex:none;min-width:40px}
.nd .tx{flex:1;min-width:0;font-size:13px;line-height:1.35;overflow-wrap:anywhere;color:var(--ink2)}
.nd .tx b{color:#fff}
.nd .cd{flex:none;font-family:var(--f-num);font-size:12.5px;font-weight:600;color:var(--nc);text-align:right;white-space:nowrap}
.nd .cd small{display:block;font:600 9.5px/1.3 var(--f-body);color:var(--mute);letter-spacing:.04em}
.allclear{padding:9px 11px;border-radius:7px;background:rgba(79,208,138,.08);border:1px solid rgba(79,208,138,.4);color:var(--up);font-size:13px;font-weight:600}
.prev{display:flex;flex-direction:column;margin-top:8px}
.prev button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--hair);padding:7px 2px;cursor:pointer;font-size:12.5px;line-height:1.35;color:var(--ink2);min-height:38px}
.prev button > span:last-child{min-width:0;overflow-wrap:anywhere}
.prev .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--amber);transform:translateY(-1px)}
.prev .dot.red{background:var(--red)} .prev .dot.grey{background:var(--grey)}
.prev button.unread{color:#fff;font-weight:600}
.find{display:flex;gap:6px;margin-top:10px}
.find input{flex:1;min-width:0;background:#0A1020;border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:9px 10px;font:inherit;font-size:13px}
.find input::placeholder{color:var(--mute)}
.fres:empty{display:none}
.fres{margin-top:4px}
.dl{display:inline-block;margin-left:6px;font:700 9.5px/1 var(--f-body);letter-spacing:.06em;padding:3px 5px;border-radius:3px;border:1px solid currentColor;color:var(--amber);vertical-align:1px}
.dl.hot{color:var(--red)}
.seatb{display:inline-block;margin-top:4px;font:700 9px/1 var(--f-body);letter-spacing:.06em;padding:3px 5px;border-radius:3px;background:var(--red);color:#fff}
.mgn{font:600 10.5px/1.2 var(--f-num);margin-top:1px}
.mgn span{font:700 9px/1 var(--f-body);letter-spacing:.06em;color:var(--mute);margin-right:3px}
.sc .s.ahead{color:var(--up)} .sc .s.behind{color:var(--dn)}
.unr{color:#fff;font-weight:700}
.kk{font-family:var(--f-num);font-weight:600;color:#fff}
.keys{font-size:11px;color:var(--mute);margin:6px 0 0}
.keys kbd{font:600 10.5px/1 var(--f-num);border:1px solid var(--line);border-radius:3px;padding:1px 4px;color:var(--ink2)}
.mtr.flash{animation:fl 1.8s ease}
@keyframes fl{0%{box-shadow:0 0 0 2px var(--gold),0 0 14px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.mtr.flash{animation:none;outline:2px solid var(--gold)}}
.rmsg{white-space:pre-line;user-select:text}
.mrow{flex-wrap:wrap;row-gap:3px}.mrow .tube{flex:1 1 100%}.mrow .bell{margin-left:auto}
@media (hover:none){.keys{display:none}}
.astrip .tal{flex:1 1 180px}
/* legibility: nothing under 9px */
.xps span,.tube span{font-size:9px}
.mtr .src,.mstate{font-size:9px}
.mtr .lgn{font-size:9.5px;height:12px}
.xrow span,.funnel span,.chartbox .ct{font-size:9.5px}
/* tap targets */
.mv .x{min-width:36px;min-height:32px;font-size:15px}
.sbar button{min-height:28px;padding:2px 10px}
.al .acts button{min-height:36px}
.linkbtn{min-height:36px}
.ctl2 button{flex:1 1 40%;min-height:38px}
.top button{width:auto;min-width:48px;height:34px;padding:0 9px}
@media (max-width:380px){.mh h1{font-size:26px}.mh .wk{font-size:19px}.mtr .pct{font-size:27px}.score .big{font-size:38px}}
</style>

"use strict";
const KEYS = ["MOST", "WINNERS", "HERS&HIS", "NEXTDOOR"];
const DK = {MOST: "DK1", WINNERS: "DK2", "HERS&HIS": "DK3", NEXTDOOR: "DK4"};

const LGN = {MOST: "Most Important", WINNERS: "Winners Sinners", "HERS&HIS": "Hers His Ver 2.0", NEXTDOOR: "Murrieta NextDoor"};
const LCOL = {MOST: "var(--l1)", WINNERS: "var(--l2)", "HERS&HIS": "var(--l3)", NEXTDOOR: "var(--l4)"};

const SLUG = {MOST: "dk1", WINNERS: "dk2", "HERS&HIS": "dk3", NEXTDOOR: "dk4"};
const BYPRINT = {"DK I": "MOST", "DK II": "WINNERS", "DK III": "HERS&HIS", "DK IV": "NEXTDOOR"};
const LIVE_SYNC_TASK = "trig_014As1cm2kT6H6bXFSbQvJL6";   /* Refresh = pull the latest Dispatch build into this page */
const RSRV = "Claude Code Remote";

let S = null, M = null, A = null, MK = {}, H = null, TR = null, MV = null, DB = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const f1 = (v) => (v === null || v === undefined || isNaN(v)) ? "–" : Number(v).toFixed(1);
const pc = (v) => (v === null || v === undefined || isNaN(v)) ? "–" : Math.round(v * 100) + "%";
const pcs = (v) => (v === null || v === undefined || isNaN(v)) ? "–" : (v * 100 < 1 && v > 0 ? "<1%" : Math.round(v * 100) + "%");
const sgn = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(d);
const norm = (n) => (n || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[.']/g, "").replace(/-/g, " ").trim()
  .replace(/\s+(jr|sr|ii|iii|iv|v)\.?$/i, "").toLowerCase().split(/\s+/).join(" ");
const store = {get(k, d){ try { const v = localStorage.getItem("dkl:" + k); return v === null ? d : JSON.parse(v); } catch(_){ return d; } },
               set(k, v){ try { localStorage.setItem("dkl:" + k, JSON.stringify(v)); } catch(_){} }};
const PT = (iso, o) => { try { return new Date(iso).toLocaleString("en-US", {timeZone: "America/Los_Angeles", ...o}); } catch(_){ return ""; } };
const ptTime = (iso) => PT(iso, {weekday: "short", hour: "numeric", minute: "2-digit"});
const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (!(m >= 0)) return ""; if (m < 1) return "just now"; if (m < 60) return m + " min ago"; const h = Math.floor(m / 60);
  if (h < 24) return h + " hr" + (m % 60 >= 30 && h < 6 ? " " + (m % 60) + " min" : "") + " ago"; const d = Math.floor(h / 24); return d + (d === 1 ? " day" : " days") + " ago"; };
const SMOOTH = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"; } catch(_){ return "auto"; } };
const dueMin = (iso) => (new Date(iso).getTime() - Date.now()) / 6e4;
const DUE = (iso) => { const m = Math.round(dueMin(iso)); if (!(m > 0)) return "now"; const d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mi = m % 60;
  return d ? d + "d " + h + "h" : h ? h + "h " + mi + "m" : mi + "m"; };
const KEYOF = {dk1: "MOST", dk2: "WINNERS", dk3: "HERS&HIS", dk4: "NEXTDOOR"};

/* ---------- game state of a man ---------- */
const isDone = (p) => /^(Fin|Final|Bye|No game)/i.test((p.when || "").trim());

/* each source's projected final for one man: Yahoo's live projection, or the expert's number (pm: [Ratcliffe, Clay, Koerner]) */
const SRCI = {r: 0, c: 1, k: 2};
function manFinal(p, src, pm){
  if (isDone(p)) return pts(p);

  const e = pm && pm[norm(p.name)] ? pm[norm(p.name)][SRCI[src]] : null;
  const base = (e === null || e === undefined) ? (+p.proj || 0) : +e;

}
const phi = (z) => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);

  if (!anyStarted && src !== "y"){
    const set = (M && M.best && M.best[L.key] && M.best[L.key].set) || {};
    const v = src === "r" ? set.ratcliffe : src === "k" ? set.koerner : set.gotham;   /* the build's best-lineup number, both sides */
    if (v !== null && v !== undefined) return +v;

  const remain = [...L.players, ...L.oppPlayers].reduce((a, p) => a + (isDone(p) || isOut(p) ? 0 : Math.max(0, manFinal(p, src, pm) - pts(p))), 0);

function dial(v, col){

  const x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);

    return `<path d="M${cx + r * Math.cos(a0)} ${cy - r * Math.sin(a0)} A${r} ${r} 0 0 1 ${cx + r * Math.cos(a1)} ${cy - r * Math.sin(a1)}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`; };
  return `<svg viewBox="0 0 120 60" aria-hidden="true">${arc(0, 1, "#26365A", 9)}${arc(0, Math.max(.01, v / 100), col, 9)}
    <line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#EEF1F6" stroke-width="2.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="4" fill="#EEF1F6"/>
    <text x="14" y="59" font-size="8" fill="#8A93A6" font-family="Poppins,sans-serif">0</text><text x="98" y="59" font-size="8" fill="#8A93A6" font-family="Poppins,sans-serif">100</text></svg>`;
}
const bellSvg = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c-2.5 0-4.2 2-4.2 4.4v2.6L2.5 11h11l-1.3-2.5V5.9C12.2 3.5 10.5 1.5 8 1.5Z" fill="currentColor"/><path d="M6.3 12.3a1.8 1.8 0 0 0 3.4 0" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>`;
/* a line chart, 0-100 on Y, any number of series [{pts:[[x,y]], col, dash}] over x labels */
function lineChart(series, xlabels, h = 110){
  const W = 340, Ht = h, pl = 26, pr = 8, pt = 8, pb = 18, n = Math.max(2, xlabels.length);
  const X = (i) => pl + (W - pl - pr) * (n === 1 ? 0 : i / (n - 1)), Y = (v) => pt + (Ht - pt - pb) * (1 - v / 100);
  let g = "";
  for (const v of [0, 50, 100]) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 50 ? "#3A4A6E" : "#1F2E50"}" stroke-width="1" ${v === 50 ? 'stroke-dasharray="3 3"' : ""}/><text x="${pl - 4}" y="${Y(v) + 3}" font-size="8.5" text-anchor="end" fill="#8A93A6" font-family="IBM Plex Mono,monospace">${v}</text>`;
  const step = Math.max(1, Math.ceil(n / 6));
  xlabels.forEach((t, i) => { if (i % step === 0 || i === n - 1) g += `<text x="${X(i)}" y="${Ht - 4}" font-size="8" text-anchor="middle" fill="#8A93A6" font-family="Poppins,sans-serif">${esc(t)}</text>`; });
  for (const s of series){
    const P = s.pts.filter(p => p[1] !== null && p[1] !== undefined && !isNaN(p[1]));
    if (!P.length) continue;
    g += `<polyline fill="none" stroke="${s.col}" stroke-width="${s.w || 2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round" points="${P.map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" ")}"/>`;
    const L = P[P.length - 1]; g += `<circle cx="${X(L[0]).toFixed(1)}" cy="${Y(L[1]).toFixed(1)}" r="3" fill="${s.col}"/>`;
  }

}
/* score range: p10-p90 bars for both sides on one scale, median marked, live score as a tick */
function rangeChart(sc, live){

/* ---------- status line ---------- */
const SCHED = {   /* Pacific schedule the page knows: Yahoo reads and the hourly Live sync */
  yahoo(d){ return d === 0 ? [[3, 50], ...Array.from({length: 13}, (_, i) => [8 + i, 50])] : d === 7 ? [] : [[3, 25], [9, 25], [13, 25], [16, 25], [18, 25], [21, 25]]; },
  sync(){ return Array.from({length: 20}, (_, i) => [4 + i, 18]); }
};
function pacNow(){ const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {timeZone: "America/Los_Angeles", weekday: "short", hour: "numeric", minute: "numeric", hour12: false}).formatToParts(new Date()).map(x => [x.type, x.value]));
  return {d: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday), m: (+p.hour % 24) * 60 + (+p.minute)}; }
function nextRun(){ const n = pacNow(); let best = null;
  for (let add = 0; add < 2 && best === null; add++){ const d = (n.d + add) % 7;
    for (const [lab, fn] of [["Yahoo read", SCHED.yahoo], ["Live sync", SCHED.sync]]) for (const [h, mi] of fn(d)){ const t = h * 60 + mi + add * 1440;
      if (t > n.m && (best === null || t < best.t)) best = {t, lab}; } }
  if (!best) return ""; const t = best.t % 1440, h = Math.floor(t / 60), mi = t % 60;
  return `${best.t >= 1440 ? "tomorrow " : ""}${(h % 12) || 12}:${String(mi).padStart(2, "0")} ${h < 12 ? "AM" : "PM"} (${best.lab})`; }
function lastYahooSlotMin(){ const n = pacNow(); let best = null;
  for (let back = 0; back < 2; back++){ const d = (n.d - back + 7) % 7; for (const [h, mi] of SCHED.yahoo(d)){ const t = h * 60 + mi - back * 1440; if (t <= n.m && (best === null || t > best)) best = t; } }
  return best === null ? null : n.m - best; }
function lights(){
  const st = (M && M.status) || {}, age = S ? (Date.now() - new Date(S.stamp).getTime()) / 6e4 : 1e9, since = lastYahooSlotMin();
  let y = "grey"; if (S){ y = age < 14 * 60 ? "green" : age < 26 * 60 ? "yellow" : "red"; if (since !== null && age > since + 75) y = age < 26 * 60 ? "yellow" : "red"; if (st.yahoo && st.yahoo.ok === false) y = "red"; }
  const d = H ? (H.worst === "red" ? "red" : H.worst === "yellow" ? "yellow" : "green") : "grey";

}

function whoLeft(){

    (byWhen[key] = byWhen[key] || {})[id] = (byWhen[key][id] || {name: p.name, tm: p.tm, mine: [], opp: []}); byWhen[key][id][side].push(k); };
  for (const k of KEYS){ const L = lgS(k); if (!L) continue; L.players.filter(p => !isDone(p) && !isOut(p)).forEach(p => add(p, k, "mine")); L.oppPlayers.filter(p => !isDone(p) && !isOut(p)).forEach(p => add(p, k, "opp")); }
  const order = (w) => w === "Playing now" ? -1 : (((M && M.kicks) || []).length ? 0 : 0);
  const ws = Object.keys(byWhen).sort((a, b) => order(a) - order(b) || whenRank(a) - whenRank(b));
  if (!ws.length) return `<div class="empty">Nobody left to play this week.</div>`;
  return ws.map(w => `<div class="sub">${esc(w)}</div>` + Object.values(byWhen[w]).sort((a, b) => b.mine.length - a.mine.length).map(x =>
    `<div class="mv"><span class="k">${x.mine.map(k => `<span class="lgtag" style="color:${LCOL[k]}">${DK[k]}</span>`).join(" ") || '<span class="mute">opp</span>'}</span><span class="t"><b>${esc(x.name)}</b> <span class="mute">${esc(x.tm || "")}</span>${x.mine.length > 1 ? ` <span class="chip y">×${x.mine.length}</span>` : ""}${x.opp.length ? ` <span class="mute">· against you in ${x.opp.map(k => DK[k]).join(", ")}</span>` : ""}</span></div>`).join("")).join("");

function whenRank(w){ const m = /(Thu|Fri|Sat|Sun|Mon|Tue)\s+(\d+):(\d+)\s*(am|pm)/i.exec(w || ""); if (!m) return 9999;
  const d = {Thu: 0, Fri: 1, Sat: 2, Sun: 3, Mon: 4, Tue: 5}[m[1].slice(0, 1).toUpperCase() + m[1].slice(1, 3).toLowerCase()];
  return d * 1440 + ((+m[2] % 12) + (/pm/i.test(m[4]) ? 12 : 0)) * 60 + (+m[3]); }
function rooting(){
  const net = {};
  for (const k of KEYS){ const L = lgS(k); if (!L) continue;
    for (const p of L.players) if (!isDone(p) && !isOut(p)) (net[p.name] = net[p.name] || {n: 0, f: [], a: []}).n++, net[p.name].f.push(k);
    for (const p of L.oppPlayers) if (!isDone(p) && !isOut(p)) (net[p.name] = net[p.name] || {n: 0, f: [], a: []}).n--, net[p.name].a.push(k); }
  const xs = Object.entries(net).map(([n, v]) => ({name: n, ...v})).sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));

    `<div class="mv"><span class="k"><span class="chip ${cls}">${x.n > 0 ? "+" + x.n : x.n}</span></span><span class="t"><b>${esc(x.name)}</b> <span class="mute">${x.f.length ? "yours in " + x.f.map(k => DK[k]).join(", ") : ""}${x.f.length && x.a.length ? " · " : ""}${x.a.length ? "against you in " + x.a.map(k => DK[k]).join(", ") : ""}</span></span></div>`).join("") : ""; };

  const roadCnt = `${mvs.length} pickups · ${calls.length} injury · ${trades.length} trades`;

    return [s, last ? last[0] : "", last ? last[1][0] : null, avg, ws.length]; }).sort((a, b) => a[3] - b[3]);
  const byes = {}; for (const r of ((M && M.rosters && M.rosters.t && M.rosters.t[DKP[k]]) || [])){ const wk = (M.byes || {})[r[3]]; if (wk) for (const w of wk) if (w >= (S.week || 0)) (byes[w] = byes[w] || []).push(r[0]); }
  const analytics = `${m.viz && m.viz.weeks ? `<div class="sub">Chance to win, week by week</div><div class="heat">${Object.entries(m.viz.weeks).map(([w, v]) => { const col = v >= .6 ? "#4FD08A" : v >= .45 ? "#F7C531" : "#FF6B72"; return `<div style="background:${col}"><span>WK ${w}</span>${pc(v)}</div>`; }).join("")}</div>` : ""}
    ${hist.length >= 2 ? `<div class="sub">Playoff odds over time</div>${lineChart([{col: HEX[k], pts: hist.map((h, i) => [i, h[1] * 100])}], hist.map(h => PT(h[0], {month: "numeric", day: "numeric"})), 100)}` : `<p class="note">Playoff odds history: ${hist.length} point${hist.length === 1 ? "" : "s"} so far (${hist.length ? pcs(hist[0][1]) : "–"}); the line draws from the second build on.</p>`}
    ${Object.keys(byes).length ? `<div class="sub">Byes ahead</div>${Object.entries(byes).sort((a, b) => a[0] - b[0]).map(([w, ns]) => `<div class="mv"><span class="k">Wk ${w}</span><span class="t">${esc(ns.join(", "))}</span></div>`).join("")}` : ""}
    ${accRows.length ? `<div class="sub">Who's been most accurate</div><table class="tbl"><tr><th>Source</th><th>Last graded</th><th>Season avg</th><th>Weeks</th></tr>${accRows.map(r => `<tr><td>${esc(r[0][0].toUpperCase() + r[0].slice(1))}</td><td>${r[2] === null ? "–" : r[2].toFixed(2)} <span class="mute">wk ${esc(r[1])}</span></td><td>${r[3].toFixed(2)}</td><td>${r[4]}</td></tr>`).join("")}</table><p class="note">${esc((M.acc || {}).note || "")}. All four leagues together.</p>` : ""}`;

    return {n, v, sp}; }).filter((x, i, arr) => arr.findIndex(y => y.v.pos === x.v.pos && y.v.r === x.v.r && y.v.k === x.v.k && y.v.c === x.v.c) === i).sort((a, b) => b.sp - a.sp);
  const experts = xpc.length ? `<div class="xpc">${xpc.map(({n, v, sp}) => `<div class="c${sp >= 3 ? " split" : ""}"><b>${esc(n)}</b><div class="why">${esc(v.pos || "")} · ${esc(v.why || "")}${sp >= 3 ? " · split " + sp.toFixed(1) : ""}</div>
      <div class="ns"><span>R ${f1(v.r)}</span><span>K ${f1(v.k)}</span><span>C ${f1(v.c)}</span></div></div>`).join("")}</div><p class="note">This week in ${DK[k]} scoring: R = Ratcliffe (FTN, leads), K = Koerner (FantasyLabs), C = Clay (ESPN). Gold edge = the experts split by 3+ points. ${esc((m.experts || {}).read ? "Ranks read " + m.experts.read : "")}</p>
      ${((m.experts || {}).rising || []).length ? `<div class="sub">Moving up</div>${m.experts.rising.map(t => `<div class="pk">${esc(t)}</div>`).join("")}` : ""}
      ${((m.experts || {}).sliding || []).length ? `<div class="sub">Sliding</div>${m.experts.sliding.map(t => `<div class="pk">${esc(t)}</div>`).join("")}` : ""}` : `<div class="empty">No expert numbers for this league yet.</div>`;

  /* weather for the teams in this game */
  const teams = new Set([...L.players, ...L.oppPlayers].filter(p => !isDone(p)).map(p => (p.tm || "").toUpperCase()));
  const WX = (M && M.wx && M.wx.teams) || {}, games = {};
  for (const t of teams){ const w = WX[t]; if (w && !games[w.game]) games[w.game] = w; }
  const wxs = Object.values(games).sort((a, b) => (b.flag - a.flag) || String(a.ko).localeCompare(String(b.ko)));
  const sky = (w) => w.roof === "dome" ? `<svg viewBox="0 0 26 20"><path d="M3 17a10 10 0 0 1 20 0z" fill="#5C677D"/></svg>` : w.snow > 0 ? `<svg viewBox="0 0 26 20"><circle cx="13" cy="9" r="6" fill="#DDE6F5"/><text x="13" y="19" font-size="7" text-anchor="middle" fill="#DDE6F5">✶✶</text></svg>`
    : /rain/.test(w.sky) || w.pop >= 60 ? `<svg viewBox="0 0 26 20"><ellipse cx="13" cy="8" rx="9" ry="5" fill="#8A93A6"/><path d="M8 14l-1 4M13 14l-1 4M18 14l-1 4" stroke="#5B9BF5" stroke-width="1.6"/></svg>`
    : /cloud/.test(w.sky) ? `<svg viewBox="0 0 26 20"><ellipse cx="13" cy="11" rx="10" ry="6" fill="#9AA2B5"/></svg>` : `<svg viewBox="0 0 26 20"><circle cx="13" cy="10" r="6" fill="#F7C531"/></svg>`;
  const wx = wxs.length ? `<div class="wxg">${wxs.map(w => `<div class="wc${w.flag ? " bad" : ""}">${sky(w)}<div class="t"><b>${esc(w.game)}</b><br>${w.roof === "dome" ? "Dome" : `${Math.round(w.temp)}°F · wind ${Math.round(w.wind)} mph · rain ${w.pop}%`}${w.flag ? `<br><span class="why">${esc((w.why || []).join(", ") || "can move the game")}</span>` : ""}</div></div>`).join("")}</div><p class="note">Kickoff forecast, Open-Meteo, pulled ${esc(M.wx ? ptTime(M.wx.pulled) : "")}. Red = weather that can move the game.</p>` : `<div class="empty">No weather for games still to play.</div>`;

    <p class="note">Alerts are deleted for good. Notes, pickups, injury calls and trades are cleared until something real changes (a different drop, a 3-point swing in playoff odds, a new injury status).</p>`;

  const rec = [m.rec ? "Record " + m.rec : "", (m.std || []).map(x => x.join(" ")).join(" · "), m.oppRec ? "opponent " + m.oppRec : ""].filter(Boolean).join(" · ");
  return `<article class="card" id="${SLUG[k]}" style="--lc:${LCOL[k]}">
    <div class="chd"><span class="lgname">${esc(LGN[k])}</span><span class="dkt">${DK[k]}</span><span class="vs">vs</span><span class="opp">${esc(L.opp)}</span></div>
    <div class="recl">${esc(rec)}</div>
    ${scoreHtml}${takes}${seatHtml}
    <div class="xrow">${xr}</div><p class="note">Chance to win this week, best lineup both sides. Ratcliffe leads every decision number.</p>${splitHtml}

    ${fold("clr-" + SLUG[k], "Clear " + DK[k], "", clr)}

}

const alertRow = (x) => { const k = BYPRINT[x.lg];
  return `<button type="button" class="${mk(x.id).read ? "" : "unread"}" data-goal="${esc(x.id)}"><span class="dot ${x.color}"></span><span><span class="lgtag" style="color:${LCOL[k] || "var(--ink)"}">${esc(DK[k] || x.lg)}</span> ${esc(x.title)}${x.deadline_utc && dueMin(x.deadline_utc) > 0 ? `<span class="dl${dueMin(x.deadline_utc) < 180 ? " hot" : ""}">${DUE(x.deadline_utc)} LEFT</span>` : ""}</span></button>`; };
/* ---------- needs you: before-lock free agents, act-now alerts, empty seats ---------- */
function needs(){
  const box = $("#need"); if (!box || !S) return;
  const out = [];
  for (const x of alertsAll().filter(aLive)){ const k = BYPRINT[x.lg];
    if (x.kind === "radar_prekick" && x.deadline_utc && dueMin(x.deadline_utc) > 0)
      out.push({k, col: dueMin(x.deadline_utc) < 180 ? "red" : "gold", r: 1, t: dueMin(x.deadline_utc), aid: x.id, cd: DUE(x.deadline_utc), cl: "until lock",
        html: `<b>${esc(x.who || "")}</b> is a free agent you could start. Free to add until ${esc((x.by || "").replace(/^before /i, "") || ptTime(x.deadline_utc))}.`});
    else if (x.color === "red")
      out.push({k, col: "red", r: 0, t: x.deadline_utc ? dueMin(x.deadline_utc) : 0, aid: x.id, cd: x.deadline_utc && dueMin(x.deadline_utc) > 0 ? DUE(x.deadline_utc) : "", cl: "act now", html: esc(x.title)});
  }
  for (const k of KEYS){ const L = lgS(k); if (!L) continue;
    for (const p of emptySeats(L)) out.push({k, col: "red", r: 0, t: whenRank(p.when), cd: "", cl: p.when ? "locks " + p.when : "",
      html: `Empty seat: <b>${esc(p.slot)} ${esc(p.name)}</b>${p.status ? " (" + esc(p.status) + ")" : ""} won't score. Yahoo has him at ${f1(p.proj)}.`}); }
  out.sort((a, b) => (a.col === "red" ? 0 : 1) - (b.col === "red" ? 0 : 1) || a.r - b.r || a.t - b.t);
  box.innerHTML = out.length ? `<div class="need">${out.map(o => `<button type="button" class="nd ${o.col}" ${o.aid ? `data-goal="${esc(o.aid)}"` : `data-jump="${SLUG[o.k]}"`}><span class="lgtag" style="color:${LCOL[o.k] || "var(--ink)"}">${DK[o.k] || ""}</span><span class="tx">${o.html}</span>${o.cd || o.cl ? `<span class="cd">${esc(o.cd)}<small>${esc(o.cl)}</small></span>` : ""}</button>`).join("")}</div>`
    : `<div class="allclear">Nothing needs you right now: no free agent to grab before lock, no empty seat, no act-now alert.</div>`;
}
/* open one alert in its league card */
async function goAlert(id){

  const fid = "al-" + SLUG[k]; FOLDS[fid] = true; store.set("folds", FOLDS);
  const d = document.querySelector(`details[data-fold="${fid}"]`); if (d) d.open = true;

  OPEN.add(id);

  const el = [...document.querySelectorAll("#cards .al")].find(e => e.dataset.aid === id); el && el.scrollIntoView({behavior: SMOOTH(), block: "center"});

/* find a player */
function findRun(){
  const box = $("#fres"), raw = $("#findq").value.trim(), q = norm(raw); if (q.length < 2){ box.innerHTML = ""; return; }
  const ros = []; for (const k of KEYS){ const L = lgS(k); if (!L) continue;
    for (const p of L.players) if (norm(p.name).includes(q)) ros.push({k, p, mine: true});
    for (const p of L.oppPlayers) if (norm(p.name).includes(q)) ros.push({k, p, mine: false}); }
  const hits = alertsAll().filter(x => (aLive(x) || aSep(x)) && norm([x.who, x.title, x.tie].join(" ")).includes(q)).sort(aSort);
  const mv = ((MV && MV.items) || []).filter(x => norm(x.text).includes(q));
  const html = (ros.length ? `<div class="sub">This week's lineups (${ros.length})</div>` + ros.map(r => `<div class="mv"><span class="k"><span class="lgtag" style="color:${LCOL[r.k]}">${DK[r.k]}</span></span><span class="t"><b>${esc(r.p.name)}</b> <span class="mute">${esc(r.p.slot || "")} ${esc(r.p.tm || "")} · ${r.mine ? "starts for you" : "starts against you"} · ${started(r.p) ? f1(pts(r.p)) + " pts" : "Yahoo " + f1(r.p.proj)}${r.p.status ? " · " + esc(r.p.status) : ""} · ${esc(r.p.when || "")}</span></span></div>`).join("") : "")
    + (hits.length ? `<div class="sub">Alerts (${hits.length})</div><div class="prev">${hits.map(alertRow).join("")}</div>` : "")
    + (mv.length ? `<div class="sub">Your moves (${mv.length})</div>` + mv.map(x => `<div class="mv"><span class="k mute">${esc(x.lg)}</span><span class="t">${esc(x.text)}</span></div>`).join("") : "");
  box.innerHTML = html || `<div class="empty">Nobody on this page matches “${esc(raw)}”.</div>`;
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest ? e.target : e.target.parentElement;
  const ga = t.closest("[data-goal]"); if (ga){ e.preventDefault(); await goAlert(ga.dataset.goal); return; }

  if (t.closest("[data-markread]")){ const ts = new Date().toISOString(), up = {}; for (const x of alertsAll().filter(aLive)) if (!mk(x.id).read) up[x.id] = Object.assign({}, mk(x.id), {read: ts});
    await writeMarks(up); rmsg("Marked " + Object.keys(up).length + " alerts read."); return; }
  if (t.id === "copy"){ if (!S){ rmsg("No scores yet - the first read hasn't landed.", 1); return; } const txt = scoresText();
    try { await navigator.clipboard.writeText(txt); rmsg("Copied the four scores."); } catch(_){ rmsg("This view blocked copying. Select the text below:\n\n" + txt, 1); } return; }

  if (t.id === "goNext"){ const nx = nextTarget(); nx && jumpTo(nx.id); return; }
  if (t.id === "openAll" || t.id === "closeAll"){ const o = t.id === "openAll"; document.querySelectorAll("details[data-fold]").forEach(d => { d.open = o; FOLDS[d.dataset.fold] = o; }); store.set("folds", FOLDS); return; }
  if (t.id === "wake"){ try { if (wakeLock){ await wakeLock.release(); wakeLock = null; t.classList.remove("on"); t.textContent = "Keep screen on"; }
      else { wakeLock = await navigator.wakeLock.request("screen"); t.classList.add("on"); t.textContent = "Screen stays on"; wakeLock.addEventListener("release", () => { wakeLock = null; t.classList.remove("on"); t.textContent = "Keep screen on"; }); } }
    catch(_){ rmsg("This view can't keep the screen on.", 1); } return; }
  if (t.id === "refresh"){ t.disabled = true; t.textContent = "Asking…";
    try { const mcp = await window.claude?.use?.("mcp"); if (!mcp) throw {code: "no_mcp"};
      await mcp.callTool(RSRV, "fire_trigger", {trigger_id: LIVE_SYNC_TASK}); rmsg("Asked for the Live sync - the newest build lands here in about 2 minutes.");
    } catch(err){ rmsg(err && err.code === "no_mcp" ? "Refresh needs the Claude Code Remote connector in this view; the hourly sync keeps running." : "Refresh didn't start (" + ((err && (err.code || err.message)) || "error") + "). The hourly sync keeps running.", 1); }
    finally { setTimeout(() => { t.disabled = false; t.textContent = "Refresh"; }, 4000); } return; }
  const nb = t.closest("[data-noted]"); if (nb){ const k = nb.dataset.noted; SHOWNOTED.has(k) ? SHOWNOTED.delete(k) : SHOWNOTED.add(k); renderAlertsOnly(); return; }
  const mx = t.closest("[data-mvx]"); if (mx){ await writeMarks({["mvd:" + mx.dataset.mvx]: {at: new Date().toISOString()}}); renderAll(); return; }
  const bulk = t.closest("[data-abulk]"); if (bulk){ const id = bulk.dataset.abulk; if (!armed(id)) return;
    const [op, k] = id.split(":"), ts = new Date().toISOString(), up = {};
    const pool = op === "delsep" ? alertsAll().filter(aSep) : alertsAll().filter(aLive);
    for (const x of pool) if (k === "ALL" || BYPRINT[x.lg] === k) up[x.id] = Object.assign({}, mk(x.id), op === "sep" ? {cleared: ts, read: mk(x.id).read || ts} : {deleted: ts});
    await writeMarks(up); renderAll(); return; }
  const cl = t.closest("[data-clr]"); if (cl){ const id = "clr:" + cl.dataset.clr; if (!armed(id)) return;
    const [k, w] = cl.dataset.clr.split(":"), ts = new Date().toISOString(), up = {}, c = lgM(k).champ || {};
    if (w === "alerts" || w === "all") for (const x of aFor(k, aLive)) up[x.id] = Object.assign({}, mk(x.id), {deleted: ts});
    if (w === "notes" || w === "all") for (const x of movesItems(k)) up["mvd:" + x.id] = {at: ts};
    if (w === "pickups" || w === "all") for (const x of c.moves || []) up["x:" + moveId(k, x)] = {at: ts, sig: sigMove(x)};
    if (w === "calls" || w === "all") for (const x of c.calls || []) up["x:" + callId(k, x)] = {at: ts, sig: sigCall(x)};
    if (w === "trades" || w === "all") for (const x of c.trades || []) up["x:" + tradeId(k, x)] = {at: ts, sig: sigTrade(x)};
    await writeMarks(up); renderAll(); return; }
  const card = t.closest(".al"); if (card){ const id = card.dataset.aid, act = t.closest("[data-ado]");
    if (act){ e.stopPropagation(); const a = act.dataset.ado, ts = new Date().toISOString(); OPEN.delete(id);
      if (a === "close"){ renderAlertsOnly(); return; }
      await writeMarks({[id]: Object.assign({}, mk(id), a === "del" ? {deleted: ts} : {cleared: ts, read: mk(id).read || ts})}); return; }
    if (t.closest(".b") && OPEN.has(id)) return;
    OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id);
    if (!mk(id).read) await writeMarks({[id]: Object.assign({}, mk(id), {read: new Date().toISOString()})}); else renderAlertsOnly(); return; }
});
document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".al,.mtr")){ e.preventDefault(); e.target.click(); } });
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches && e.target.matches("input,textarea,select,[contenteditable]")){ if (e.key === "Escape") e.target.blur(); return; }
  if (/^[1-4]$/.test(e.key)){ e.preventDefault(); jumpTo("dk" + e.key); }
  else if (e.key === "t" || e.key === "T"){ scrollTo({top: 0, behavior: SMOOTH()}); }
  else if (e.key === "n" || e.key === "N"){ const nx = nextTarget(); nx && jumpTo(nx.id); }
  else if (e.key === "/"){ e.preventDefault(); $("#findq").focus(); }
  else if (e.key === "Escape"){ if (OPEN.size){ OPEN.clear(); renderAlertsOnly(); } const b = $("#hc"); if (!b.hidden){ b.hidden = true; $("#stat").setAttribute("aria-expanded", "false"); } }
});
$("#findq").addEventListener("input", findRun);
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (/^dk[1-4]$/.test(h)) document.getElementById(h)?.scrollIntoView({behavior: SMOOTH(), block: "start"}); });
let wakeLock = null, HASHED = false;
/* sticky scoreboard once the meters scroll away */
try { new IntersectionObserver(([en]) => { $("#sticky").hidden = en.isIntersecting || !S; }, {threshold: 0}).observe($("#metersFrame")); } catch(_){}
setInterval(() => { renderStatus(); if (S){ meters(); needs(); } }, 60000);

/* ---------- data ---------- */
(async () => {
  const db = await window.claude?.use?.("db");
  if (!db){ $("#statTxt").innerHTML = `<span class="late">Can't reach the live feed in this view.</span> Open Dark Knight Live from your Claude sidebar or artifact list.`; $("#meters").innerHTML = `<div class="empty" style="grid-column:1/-1">No data in this view.</div>`; return; }
  DB = db;
  const val = (s) => s && (s.data ? s.data() : s);
  const watch = (path, fn) => { try { db.doc(path).onSnapshot(s => { if (FEED_ERR.delete(path)) renderStatus(); fn(val(s)); },
      () => { FEED_ERR.add(path); renderStatus(); setTimeout(() => watch(path, fn), 30000); }); }
    catch(_){ db.doc(path).get().then(s => fn(val(s))).catch(() => {}); } };
  const tm = setTimeout(() => { if (!S) $("#statTxt").innerHTML = `<span class="late">The live feed hasn't answered in 10 seconds.</span> It keeps trying.`; }, 10000);
  try { TR = val(await db.doc("live/trail").get()) || {entries: []}; } catch(_){ TR = {entries: []}; }
  if (!Array.isArray(TR.entries)) TR = {entries: []};
  watch("live/alert_marks", v => { MK = Object.assign({}, v || {}); if (S) renderAll(); });
  watch("live/moves", v => { MV = v || null; if (S) renderAll(); });
  watch("live/health", v => { H = v || null; renderStatus(); renderHealth(); });
  watch("live/alerts", v => { A = v || null; if (S) renderAll(); });
  watch("live/models", v => { if (v){ M = v; if (S){ renderAll(); trailAdd(); } } });
  watch("live/state", v => { if (v && v.leagues){ clearTimeout(tm); S = v; renderAll(); if (M) trailAdd();
    if (!HASHED){ HASHED = true; const h = location.hash.slice(1); if (/^dk[1-4]$/.test(h)) setTimeout(() => document.getElementById(h)?.scrollIntoView({block: "start"}), 60); } } });
})();
</script>
