name: DK feed pull
on:
  schedule:
    # times are UTC. Pacific = UTC-7 until Nov 1, then UTC-8.
    # v2 Oct 7: every 30 minutes, ~5 AM to ~11 PM Pacific. RotoWire's feed only holds a handful of
    # items at a time, so news that scrolls off between runs is lost forever. Public repo = no cost.
    - cron: '*/30 12-23 * * *'
    - cron: '*/30 0-6 * * *'
  workflow_dispatch: {}            # a manual 'Run now' button
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python pull_feeds.py
      - name: save results back to the repo
        run: |
          git config user.name dk-feed-bot
          git config user.email dk-feed-bot@users.noreply.github.com
          git add feeds
          git commit -m "feeds $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing changed"
          git push
