name: DK feed pull
on:
  schedule:
    # times are UTC.
    # Nov 1 2026: moved one UTC hour later for standard time (PST, UTC-8) so each lands at the Pacific time it was set for. Move back one hour Mar 8 2027.
    # v2 Oct 7: every 30 minutes, ~5 AM to ~11 PM Pacific. RotoWire's feed only holds a handful of
    # items at a time, so news that scrolls off between runs is lost forever. Public repo = no cost.
    - cron: '7,37 13-23 * * *'   # Oct 19: off the :00/:30 rush - GitHub starts top-of-hour jobs late
    - cron: '7,37 0-7 * * *'
    # Oct 19 (Dom): hourly overnight too (midnight-5 AM PT) - news that broke overnight was never seen
    - cron: '13 8-12 * * *'
  workflow_dispatch: {}            # a manual 'Run now' button
permissions:
  contents: write
  actions: read                    # Nov 5: wait_pages.sh checks for a Pages deploy in progress
env:
  GH_TOKEN: ${{ github.token }}     # Nov 5: for wait_pages.sh
concurrency:                       # v4: two runs never overlap
  group: dk-feeds
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python pull_feeds.py
      - name: save results back to the repo
        run: |
          git config user.name dk-feed-bot
          git config user.email dk-feed-bot@users.noreply.github.com
          git add feeds
          git commit -m "feeds $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing changed"; exit 0; }
          # v4: get GitHub's latest copy first, so a re-run or an overlap can't be rejected as out of date
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && { bash .github/wait_pages.sh; git push; } && exit 0
            sleep 5
          done
          echo "save failed after 3 tries"; exit 1
