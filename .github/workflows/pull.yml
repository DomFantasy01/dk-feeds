name: DK feed pull
on:
  schedule:
    # times are UTC. Pacific = UTC-7 until Nov 1, then UTC-8.
    - cron: '0 13,20,3 * * *'      # ~6 AM, 1 PM, 8 PM Pacific every day
    - cron: '30 15,16,18,19 * * 0' # Sunday ~8:30, 9:30, 11:30 AM, 12:30 PM Pacific: inactives window
    - cron: '0 22,23 * * 4'        # Thursday ~3 and 4 PM Pacific, before TNF
  workflow_dispatch: {}            # a manual 'Run now' button
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python pull_feeds.py
      - name: save results back to the repo
        run: |
          git config user.name dk-feed-bot
          git config user.email dk-feed-bot@users.noreply.github.com
          git add feeds
          git commit -m "feeds $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing changed"
          git push
