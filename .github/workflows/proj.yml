name: DK projection test pull
on:
  schedule:
    # every 2 hours, all day (UTC). Pacific = UTC-7 until Nov 1.
    - cron: '15 */2 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: dk-feeds            # same group as the news job: the two never write at the same time
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas numpy lxml html5lib
      - run: python pull_proj.py
      - run: python grade_job.py
      - name: save results back to the repo
        run: |
          git config user.name dk-feed-bot
          git config user.email dk-feed-bot@users.noreply.github.com
          git add feeds/proj
          git commit -m "proj $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing changed"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          echo "save failed after 3 tries"; exit 1
