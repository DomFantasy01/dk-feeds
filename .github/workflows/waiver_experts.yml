name: DK waiver experts
# Oct 27 2026 (Dom): named experts' free waiver columns, read BEFORE claims process (Yahoo claims run overnight Tue->Wed).
# Times are UTC. Pacific (PDT, UTC-7, until Nov 1): Mon 6:17 AM, Tue 6:17 AM, Tue 10:17 AM, Tue 3:17 PM, Tue 6:17 PM.
# After Nov 1 (PST) each lands one hour earlier in Pacific - move these one hour later then.
on:
  schedule:
    - cron: '17 13 * * 1'
    - cron: '17 13 * * 2'
    - cron: '17 17 * * 2'
    - cron: '17 22 * * 2'
    - cron: '17 1 * * 3'
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: dk-feeds
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: read the waiver columns
        run: python pull_waiver_experts.py .
      - name: save to the repo
        run: |
          git config user.name dk-feed-bot
          git config user.email dk-feed-bot@users.noreply.github.com
          git add yahoo_drop/morning/waiver_experts.txt
          git commit -m "waiver experts $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing changed"; exit 0; }
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          echo "save failed"; exit 1
      - name: start a Dispatch build so the brief uses them
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run dispatch.yml --ref main || echo "build not started"
