name: DK Dispatch build
# Builds the Dark Knight Dispatch front page three times a day, AFTER the feed and projection jobs have refreshed.
# Times are UTC. Pacific = UTC-7 until Nov 1 (7:45 AM, 12:45 PM, 5:45 PM PT), then UTC-8 (6:45 AM, 11:45 AM, 4:45 PM PT).
# Plus a build an hour before each kickoff slate (added Oct 8), so Gotham and Sleeper are fresh at kickoff:
#   Thu and Mon 5:00 PM PT (night games 5:15), Sun 5:30 AM PT (London 6:30), Sun 4:30 PM PT (Sunday night 5:20).
# If any step fails, the run goes red and GitHub emails you - that is the alarm. Stale or short data does not fail the run:
# it prints in red on the page and is listed in dispatch_out/alarm_wk<W>.json.
on:
  schedule:
    # Oct 9 (Dom): every build reads Yahoo first through Yahoo's own API, so the build runs on a drumbeat:
    # every 2 hours, 7 AM to 11 PM PT, every day ...
    - cron: '40 0,2,4,6,14,16,18,20,22 * * *'
    # ... and every 30 minutes through the game windows: Thu and Mon 5-9 PM PT, Sun 6 AM-9 PM PT
    - cron: '10,40 0-4 * * 2,5'
    - cron: '10,40 13-23 * * 0'
    - cron: '10,40 0-4 * * 1'
    # Oct 30 (Dom: the brief must be current by 4 AM, last night's games included - "do it at 4 a.m., not 4:30"):
    # 11:00 UTC = 4 AM PDT until Nov 1; 12:00 UTC = 4 AM PST after (the other one lands 5 AM / 3 AM - harmless)
    - cron: '0 11,12 * * *'
    # Times are UTC on PDT (UTC-7). After Nov 1 (PST) every time lands one hour earlier in Pacific.
  workflow_dispatch: {}            # 'Run workflow' button for an on-demand build
permissions:
  contents: write
  actions: read                    # Oct 30: lets the build save the job-run list for Live's GitHub light
concurrency:
  group: dk-feeds                  # same group as the other two jobs: never two writers at once
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45            # Oct 28: no build may hold the queue more than 45 minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas numpy reportlab
      # Oct 22 (Dom): every build pulls the news + injury feeds itself first. GitHub's scheduler skips about a third of the
      # feed job's 30-minute runs, so a gauntlet could land on hour-old feeds and go NO-GO. A failed pull keeps the last feeds.
      # Oct 28: a hung feed pull held the whole build (and every queued one) for 30+ minutes - it now gives up after 10
      - run: timeout 600 python pull_feeds.py || echo "!! feed pull failed or timed out - the build uses the last saved feeds"
      # Oct 30 (Dom, THE CHAIN): a failed build retries once by itself; only a second failure turns the run red (GitHub's email)
      - run: bash dispatch_run.sh || { echo "!! build failed - retrying once in 30 s"; sleep 30; bash dispatch_run.sh; }
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
      # Oct 30: the hourly Live sync can't read GitHub's run list (unsigned reads get refused), so each build saves it here
      - name: save the job-run list for the GitHub light
        run: gh api 'repos/${{ github.repository }}/actions/runs?per_page=100' > dispatch_out/gh_runs.json || echo "!! run list not saved"
        env:
          GH_TOKEN: ${{ github.token }}
      # Oct 31 (Dom): the chart extras for Live - workload per week (nflverse) and his four rosters; never fails the build
      - name: chart extras for Dark Knight Live
        run: timeout 180 python3 live_sync/viz_extra.py . || echo "!! chart extras not saved - Live keeps the last ones"
      - name: save the page back to the repo
        run: |
          git config user.name dk-feed-bot
          git config user.email dk-feed-bot@users.noreply.github.com
          rm -f dispatch_out/build_failed.json   # Oct 13: a good build clears the failure flag Dark Knight Live's status light reads
          git add -A dispatch_out yahoo_drop feeds $(ls -d yahoo_auth yahoo_api 2>/dev/null)   # only folders that exist (Oct 9 fix)
          git commit -m "dispatch $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing changed"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null; sleep 5; continue; }
            # Oct 19: the inactives watch also writes the state file - rebuild it on the merged copy so it is never a mix of two runs
            if python3 state/build_state.py . "${DK_ROOT:-/home/claude}" >/dev/null 2>&1 && ! git diff --quiet -- dispatch_out/dk_state_latest.json dispatch_out/dk_state_latest.txt; then
              git add dispatch_out/dk_state_latest.json dispatch_out/dk_state_latest.txt && git commit -qm "state file rebuilt on the merged copy"
            fi
            git push && exit 0
            sleep 5
          done
          echo "save failed after 3 tries"; exit 1
      - name: record a failed build for Dark Knight Live's status light (Oct 13)
        if: failure()
        run: |
          git config user.name dk-feed-bot
          git config user.email dk-feed-bot@users.noreply.github.com
          git stash --include-untracked >/dev/null 2>&1 || true
          mkdir -p dispatch_out
          for i in 1 2 3; do
            git pull --rebase origin main >/dev/null 2>&1 || true
            echo "{\"at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"run\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" > dispatch_out/build_failed.json
            git add dispatch_out/build_failed.json && git commit -m "build failed $(date -u +%Y-%m-%dT%H:%MZ)" >/dev/null 2>&1
            git push && exit 0
            sleep 5
          done
          echo "could not record the failure"
