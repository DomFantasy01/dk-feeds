name: DK Pages (Dispatch PDFs only)

# Publishes only the Dispatch PDFs to https://domfantasy01.github.io/dk-feeds/
# Replaces GitHub's built-in "pages build and deployment", which redeploys the
# whole 43 MB repo on every bot commit, piles up, and times out at 10 minutes.
# Requires: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["dispatch_out/*.pdf"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dispatch_out
      - name: Stage the PDFs
        run: |
          mkdir -p site/dispatch_out
          cp dispatch_out/*.pdf site/dispatch_out/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
