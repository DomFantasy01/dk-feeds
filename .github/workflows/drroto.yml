name: Dr. Roto scoring
# Nov 24 2026 (Dom: "Ratcliffe and Dr. Roto as the top pillars"): every Chrome read of Dr. Roto's NFL Dashboard (dk_drroto_read.js,
# committed to yahoo_drop/drroto/drroto_weekly.json) is converted to each league's scoring with Clay's volume right away ->
# dispatch_out/drroto_scored.csv. The next Dispatch build puts him on the big Live dial beside Ratcliffe.
on:
  push:
    paths: ['yahoo_drop/drroto/**', 'live_sync/drroto_points.py', '.github/workflows/drroto.yml']
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
env:
  GH_TOKEN: ${{ github.token }}
concurrency:
  group: dk-feeds
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: score Dr. Roto in league scoring
        run: python3 live_sync/drroto_points.py "$GITHUB_WORKSPACE"
      - name: save
        run: |
          git config user.name dk-feed-bot
          git config user.email dk-feed-bot@users.noreply.github.com
          git add dispatch_out/drroto_scored.csv dispatch_out/drroto_history
          git commit -m "drroto $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing changed"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null; sleep 5; continue; }
            bash .github/wait_pages.sh; git push && exit 0; sleep 5
          done; exit 1
