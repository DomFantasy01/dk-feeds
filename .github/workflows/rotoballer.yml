name: RotoBaller projections read
# Nov 8 2026 (Dom found it): RotoBaller's free projections - full stat lines for ~370 players from their own public feed. On trial
# because they called Week 9's Jets backfield (Hall ahead of Allen) when Ratcliffe, Koerner, Clay and Vegas didn't.
# Every read is logged in yahoo_drop/rotoballer/reads.jsonl with the tool's week label, the newest update stamp and a fingerprint
# of the week's opponents - that log shows WHEN each new week's numbers first appear (Dom's rule: before waivers, then updated to
# kickoff). Every 2 hours, hourly Monday evening through Tuesday evening (when the next week's list should turn over).
# Times are UTC (PST = UTC-8 until Mar 8 2027).
on:
  schedule:
    - cron: '40 */2 * * *'
    - cron: '40 2-23 * * 2'           # Mon 6 PM - Tue 3 PM PT, hourly
    - cron: '40 13-20 * * 0'          # Sunday 5 AM - 12 PM PT, hourly (final pre-kickoff updates)
  push:
    paths: ['live_sync/rotoballer_points.py', '.github/workflows/rotoballer.yml']
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
concurrency:
  group: dk-feeds
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: read RotoBaller projections
        run: |
          W=$(ls dispatch_out/meter_wk*.json | sed 's/.*_wk\([0-9]*\)\.json/\1/' | sort -n | tail -1)
          python3 live_sync/rotoballer_points.py "$GITHUB_WORKSPACE" "$W" --read-only
          python3 live_sync/rotoballer_points.py "$GITHUB_WORKSPACE" "$W" --no-read
      - name: save
        if: always()
        run: |
          git config user.name dk-feed-bot
          git config user.email dk-feed-bot@users.noreply.github.com
          git add yahoo_drop/rotoballer dispatch_out/rotoballer_scored.csv dispatch_out/rotoballer_history 2>/dev/null || true
          git commit -m "rotoballer $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing changed"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null; sleep 5; continue; }
            bash .github/wait_pages.sh; git push && exit 0; sleep 5
          done; exit 1
